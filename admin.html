<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gia's Admin">
<meta name="theme-color" content="#2C1A1A">
<link rel="manifest" href="manifest.json">
<title>Gia's — Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FDF8F3;
    --blush: #F5E6E0;
    --rose: #E8C5BA;
    --mauve: #C9A09A;
    --deep: #2C1A1A;
    --text: #3D2B2B;
    --muted: #8C6E6E;
    --white: #FFFFFF;
    --card-bg: #FFFAF7;
    --border: rgba(201,160,154,0.25);
    --yellow-bg: #FFF9EC;
    --yellow-dot: #D4A820;
    --yellow-border: rgba(200,160,30,0.3);
    --green-bg: #EDF7ED;
    --green-dot: #2E7D32;
    --green-border: rgba(46,125,50,0.3);
    --red-bg: #FDECEA;
    --red-dot: #C62828;
    --red-border: rgba(198,40,40,0.3);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* HEADER */
  header {
    background: var(--deep);
    padding: calc(var(--safe-top) + 1.25rem) 1.5rem 1.25rem;
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
  }

  .header-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 300;
    color: var(--white); letter-spacing: 0.1em;
    display: flex; align-items: center; gap: 8px;
  }
  .header-logo svg { width: 12px; height: 12px; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .notif-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: all 0.2s;
  }
  .notif-btn:hover { background: rgba(255,255,255,0.1); }
  .notif-btn svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.7); fill: none; stroke-width: 1.5; }
  .notif-badge {
    position: absolute; top: -2px; right: -2px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--yellow-dot); border: 2px solid var(--deep);
    display: none;
  }
  .notif-badge.show { display: block; }

  .live-dot {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em;
  }
  .live-dot span {
    width: 6px; height: 6px; border-radius: 50%; background: #4CAF50;
    animation: livePulse 2s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* STATS */
  .stats-bar {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-item {
    background: var(--card-bg);
    padding: 1rem; text-align: center;
  }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 500; color: var(--deep);
    line-height: 1;
  }
  .stat-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-top: 4px;
  }

  /* FILTERS */
  .filters {
    padding: 1rem 1.5rem;
    display: flex; gap: 0.5rem; overflow-x: auto;
    border-bottom: 1px solid var(--border);
    background: var(--blush);
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    white-space: nowrap; padding: 7px 18px; border-radius: 20px;
    font-size: 12px; cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; gap: 6px;
  }
  .filter-btn.active { background: var(--deep); color: var(--white); border-color: var(--deep); }
  .filter-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* PEDIDOS */
  .pedidos-container { padding: 1.25rem 1.5rem; }

  .section-date {
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 0.75rem; margin-top: 1rem;
  }
  .section-date:first-child { margin-top: 0; }

  .pedido-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 1rem;
    overflow: hidden; transition: box-shadow 0.2s;
  }
  .pedido-card:active { box-shadow: 0 4px 20px rgba(44,26,26,0.1); }

  .pedido-header {
    padding: 1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }

  .pedido-left { display: flex; align-items: center; gap: 12px; }

  .status-indicator {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .status-sin_confirmar { background: var(--yellow-dot); animation: livePulse 1.8s infinite; }
  .status-confirmado { background: var(--green-dot); }
  .status-cancelado { background: var(--red-dot); }
  .status-hecho { background: var(--muted); }

  .pedido-nombre {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 500; color: var(--deep);
  }
  .pedido-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .pedido-right { text-align: right; }
  .pedido-total {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 500; color: var(--deep);
  }

  .estado-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 10px;
    font-size: 11px; letter-spacing: 0.05em; margin-top: 4px;
  }
  .badge-sin_confirmar { background: var(--yellow-bg); color: #7A5A10; border: 1px solid var(--yellow-border); }
  .badge-confirmado { background: var(--green-bg); color: #1B5E20; border: 1px solid var(--green-border); }
  .badge-cancelado { background: var(--red-bg); color: #B71C1C; border: 1px solid var(--red-border); }
  .badge-hecho { background: var(--blush); color: var(--muted); border: 1px solid var(--border); }

  /* DETALLE EXPANDIBLE */
  .pedido-detalle {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
    border-top: 0px solid var(--border);
  }
  .pedido-detalle.open {
    max-height: 500px;
    border-top: 1px solid var(--border);
  }
  .detalle-inner { padding: 1rem 1.25rem; }

  .detalle-item {
    display: flex; justify-content: space-between;
    font-size: 14px; color: var(--text); padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .detalle-item:last-of-type { border-bottom: none; }
  .detalle-item span:first-child { color: var(--muted); }

  .detalle-total {
    display: flex; justify-content: space-between;
    font-weight: 500; color: var(--deep);
    padding-top: 10px; margin-top: 4px;
    border-top: 1px solid var(--border);
    font-family: 'Cormorant Garamond', serif; font-size: 17px;
  }

  .detalle-contacto {
    margin-top: 10px; padding: 10px; background: var(--blush);
    border-radius: 10px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .detalle-contacto svg { width: 15px; height: 15px; stroke: var(--mauve); fill: none; stroke-width: 1.5; flex-shrink: 0; }

  .acciones { display: flex; gap: 8px; margin-top: 12px; }
  .accion-btn {
    flex: 1; padding: 10px;
    border-radius: 10px; border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s; background: none;
    color: var(--muted);
  }
  .accion-btn.entregar {
    background: var(--deep); color: var(--white); border-color: var(--deep);
  }
  .accion-btn.entregar:hover { background: var(--mauve); }
  .accion-btn.cancelar:hover { background: var(--red-bg); color: var(--red-dot); border-color: var(--red-border); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty-state svg { width: 48px; height: 48px; stroke: var(--rose); fill: none; stroke-width: 1.2; margin-bottom: 1rem; }
  .empty-state p { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .empty-state small { font-size: 13px; }

  /* LOADING */
  .loading {
    text-align: center; padding: 3rem;
    color: var(--muted); font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);
    border-top-color: var(--mauve); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed; bottom: calc(80px + 1rem); left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--deep); color: var(--white);
    padding: 10px 24px; border-radius: 24px; font-size: 13px;
    z-index: 500; opacity: 0; transition: all 0.3s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* NOTIF PERMISSION BANNER */
  .notif-banner {
    background: var(--blush); border-bottom: 1px solid var(--border);
    padding: 0.875rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .notif-banner p { font-size: 13px; color: var(--text); line-height: 1.4; }
  .notif-banner p strong { color: var(--deep); }
  .notif-allow {
    white-space: nowrap; padding: 8px 16px; border-radius: 20px;
    background: var(--deep); color: var(--white); border: none;
    font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.05em;
  }
  .notif-dismiss {
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <svg viewBox="0 0 14 14" fill="#E8C5BA" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 0L8.2 5.8L14 7L8.2 8.2L7 14L5.8 8.2L0 7L5.8 5.8Z"/>
    </svg>
    Gia's
  </div>
  <div class="header-right">
    <div class="live-dot"><span></span>En vivo</div>
    <button class="notif-btn" id="notifBtn" onclick="solicitarNotificaciones()">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="notif-badge" id="notifBadge"></div>
    </button>
  </div>
</header>

<div id="notifBanner" class="notif-banner" style="display:none">
  <p><strong>Activa las notificaciones</strong> para saber cuando llega un pedido nuevo.</p>
  <button class="notif-allow" onclick="solicitarNotificaciones()">Activar</button>
  <button class="notif-dismiss" onclick="cerrarBanner()">&#x2715;</button>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num" id="statPendientes">0</div>
    <div class="stat-label">Pendientes</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statConfirmados">0</div>
    <div class="stat-label">Confirmados</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statTotal">$0</div>
    <div class="stat-label">Hoy</div>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
  <button class="filter-btn" onclick="filtrar('sin_confirmar', this)">
    <span class="filter-dot" style="background:#D4A820"></span>Sin confirmar
  </button>
  <button class="filter-btn" onclick="filtrar('confirmado', this)">
    <span class="filter-dot" style="background:#2E7D32"></span>Confirmados
  </button>
  <button class="filter-btn" onclick="filtrar('hecho', this)">
    <span class="filter-dot" style="background:#8C6E6E"></span>Hechos
  </button>
  <button class="filter-btn" onclick="filtrar('cancelado', this)">
    <span class="filter-dot" style="background:#C62828"></span>Cancelados
  </button>
</div>

<!-- PEDIDOS -->
<div class="pedidos-container" id="pedidosContainer">
  <div class="loading">
    <div class="spinner"></div>
    Cargando pedidos...
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsTW5ZyPkshQG6E_ZRisMeo3vxft4TuL8",
  authDomain: "gia-s-830e9.firebaseapp.com",
  projectId: "gia-s-830e9",
  storageBucket: "gia-s-830e9.firebasestorage.app",
  messagingSenderId: "695351178205",
  appId: "1:695351178205:web:6b269da32caaaf1f763c34"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosLosPedidos = [];
let filtroActual = 'todos';
let primeraVez = true;

// Escuchar pedidos en tiempo real
const q = query(collection(db, 'pedidos'), orderBy('fecha', 'desc'));
onSnapshot(q, (snapshot) => {
  const pedidosNuevos = [];
  snapshot.forEach(d => {
    pedidosNuevos.push({ id: d.id, ...d.data() });
  });

  // Notificación push si llega pedido nuevo
  if (!primeraVez) {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const p = change.doc.data();
        enviarNotificacion(`Nuevo pedido de ${p.cliente}`, `Total: $${p.total?.toFixed(2)}`);
      }
      if (change.type === 'modified') {
        const p = change.doc.data();
        if (p.estado === 'confirmado') {
          enviarNotificacion(`Pedido confirmado`, `${p.cliente} confirmó su reserva`);
        }
      }
    });
  }
  primeraVez = false;

  todosLosPedidos = pedidosNuevos;
  actualizarStats();
  renderPedidos();
});

function actualizarStats() {
  const pendientes = todosLosPedidos.filter(p => p.estado === 'sin_confirmar').length;
  const confirmados = todosLosPedidos.filter(p => p.estado === 'confirmado').length;

  const hoy = new Date();
  const totalHoy = todosLosPedidos
    .filter(p => {
      if (!p.fecha) return false;
      const f = p.fecha.toDate ? p.fecha.toDate() : new Date(p.fecha);
      return f.toDateString() === hoy.toDateString() && p.estado !== 'cancelado';
    })
    .reduce((sum, p) => sum + (p.total || 0), 0);

  document.getElementById('statPendientes').textContent = pendientes;
  document.getElementById('statConfirmados').textContent = confirmados;
  document.getElementById('statTotal').textContent = '$' + totalHoy.toFixed(0);

  document.getElementById('notifBadge').classList.toggle('show', pendientes > 0);
}

function renderPedidos() {
  const container = document.getElementById('pedidosContainer');
  const filtrados = filtroActual === 'todos'
    ? todosLosPedidos
    : todosLosPedidos.filter(p => p.estado === filtroActual);

  if (filtrados.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 48 48"><path d="M12 4L6 12v28a4 4 0 004 4h28a4 4 0 004-4V12l-6-8z" stroke-linecap="round" stroke-linejoin="round"/><line x1="6" y1="12" x2="42" y2="12" stroke-linecap="round"/><path d="M32 20a8 8 0 01-16 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>No hay pedidos aquí</p>
        <small>Los pedidos aparecen en tiempo real</small>
      </div>`;
    return;
  }

  container.innerHTML = filtrados.map(p => {
    const fecha = p.fecha?.toDate ? p.fecha.toDate() : new Date();
    const fechaStr = fecha.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    const itemsStr = p.items?.map(i => `${i.nombre} x${i.cantidad}`).join(', ') || '';

    const estadoLabels = {
      sin_confirmar: 'Sin confirmar',
      confirmado: 'Confirmado',
      cancelado: 'Cancelado',
      hecho: 'Hecho'
    };

    const mostrarAcciones = p.estado === 'confirmado' || p.estado === 'sin_confirmar';

    return `
    <div class="pedido-card" id="card-${p.id}">
      <div class="pedido-header" onclick="toggleDetalle('${p.id}')">
        <div class="pedido-left">
          <div class="status-indicator status-${p.estado}"></div>
          <div>
            <p class="pedido-nombre">${p.cliente}</p>
            <p class="pedido-meta">${fechaStr} — ${itemsStr.substring(0, 35)}${itemsStr.length > 35 ? '...' : ''}</p>
          </div>
        </div>
        <div class="pedido-right">
          <p class="pedido-total">$${(p.total || 0).toFixed(2)}</p>
          <div class="estado-badge badge-${p.estado}">
            ${estadoLabels[p.estado] || p.estado}
          </div>
        </div>
      </div>
      <div class="pedido-detalle" id="detalle-${p.id}">
        <div class="detalle-inner">
          ${p.items?.map(i => `
            <div class="detalle-item">
              <span>${i.nombre} x${i.cantidad}</span>
              <span>$${i.subtotal?.toFixed(2)}</span>
            </div>`).join('') || ''}
          <div class="detalle-total">
            <span>Total</span>
            <span>$${(p.total || 0).toFixed(2)}</span>
          </div>
          <div class="detalle-contacto">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${p.contacto} (${p.tipoContacto})
          </div>
          ${mostrarAcciones ? `
          <div class="acciones">
            ${p.estado === 'confirmado' ? `<button class="accion-btn entregar" onclick="marcarHecho('${p.id}')">Marcar como hecho</button>` : ''}
            ${p.estado === 'sin_confirmar' ? `<button class="accion-btn cancelar" onclick="cancelarPedido('${p.id}')">Cancelar pedido</button>` : ''}
          </div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleDetalle(id) {
  const detalle = document.getElementById(`detalle-${id}`);
  detalle.classList.toggle('open');
}

async function marcarHecho(id) {
  try {
    await updateDoc(doc(db, 'pedidos', id), {
      estado: 'hecho',
      hechoEn: serverTimestamp()
    });
    showToast('Pedido marcado como hecho');
  } catch(e) {
    showToast('Error al actualizar');
  }
}

async function cancelarPedido(id) {
  try {
    await updateDoc(doc(db, 'pedidos', id), {
      estado: 'cancelado',
      canceladoEn: serverTimestamp()
    });
    showToast('Pedido cancelado');
  } catch(e) {
    showToast('Error al actualizar');
  }
}

function filtrar(estado, btn) {
  filtroActual = estado;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPedidos();
}

function enviarNotificacion(titulo, cuerpo) {
  if (Notification.permission === 'granted') {
    new Notification(titulo, {
      body: cuerpo,
      icon: '/icon-192.png',
      badge: '/icon-192.png',
      vibrate: [200, 100, 200]
    });
  }
}

function solicitarNotificaciones() {
  Notification.requestPermission().then(p => {
    if (p === 'granted') {
      showToast('Notificaciones activadas');
      cerrarBanner();
    }
  });
}

function cerrarBanner() {
  document.getElementById('notifBanner').style.display = 'none';
  localStorage.setItem('notifBannerDismissed', '1');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Mostrar banner de notificaciones si no está activado
window.addEventListener('load', () => {
  const dismissed = localStorage.getItem('notifBannerDismissed');
  if (Notification.permission !== 'granted' && !dismissed) {
    document.getElementById('notifBanner').style.display = 'flex';
  }
});

// Exponer funciones globales
window.filtrar = filtrar;
window.toggleDetalle = toggleDetalle;
window.marcarHecho = marcarHecho;
window.cancelarPedido = cancelarPedido;
window.solicitarNotificaciones = solicitarNotificaciones;
window.cerrarBanner = cerrarBanner;
</script>
</body>
</html>
