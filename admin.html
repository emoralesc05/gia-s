<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gia's Admin">
<meta name="theme-color" content="#2C1A1A">
<link rel="manifest" href="manifest.json">
<title>Gia's — Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FDF8F3;
    --blush: #F5E6E0;
    --rose: #E8C5BA;
    --mauve: #C9A09A;
    --deep: #2C1A1A;
    --text: #3D2B2B;
    --muted: #8C6E6E;
    --white: #FFFFFF;
    --card-bg: #FFFAF7;
    --border: rgba(201,160,154,0.25);
    --yellow-bg: #FFF9EC;
    --yellow-dot: #D4A820;
    --yellow-border: rgba(200,160,30,0.3);
    --green-bg: #EDF7ED;
    --green-dot: #2E7D32;
    --green-border: rgba(46,125,50,0.3);
    --red-bg: #FDECEA;
    --red-dot: #C62828;
    --red-border: rgba(198,40,40,0.3);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 2rem;
  }

  /* HEADER */
  header {
    background: var(--deep);
    padding: calc(var(--safe-top) + 1.25rem) 1.5rem 1.25rem;
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 300;
    color: var(--white); letter-spacing: 0.1em;
    display: flex; align-items: center; gap: 8px;
  }
  .header-logo svg { width: 12px; height: 12px; }
  .live-dot {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em;
  }
  .live-dot span {
    width: 6px; height: 6px; border-radius: 50%; background: #4CAF50;
    animation: livePulse 2s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* STATS */
  .stats-bar {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-item { background: var(--card-bg); padding: 1rem; text-align: center; }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 500; color: var(--deep); line-height: 1;
  }
  .stat-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-top: 4px;
  }

  /* TABS */
  .tabs {
    display: flex; background: var(--blush);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1; padding: 0.875rem; border: none; background: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    color: var(--muted); cursor: pointer; letter-spacing: 0.05em;
    border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--deep); border-bottom-color: var(--deep); font-weight: 500;
  }

  /* CONTAINER */
  .tab-content { display: none; padding: 1.25rem 1.5rem; }
  .tab-content.active { display: block; }

  /* PRODUCTO CARD */
  .producto-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 1rem;
    overflow: hidden;
  }

  .producto-header {
    padding: 1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .producto-left { display: flex; align-items: center; gap: 14px; }

  .producto-cantidad {
    width: 52px; height: 52px; border-radius: 12px;
    background: var(--deep);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cantidad-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 500; color: var(--white); line-height: 1;
  }
  .cantidad-label { font-size: 9px; color: var(--rose); letter-spacing: 0.1em; text-transform: uppercase; }

  .producto-nombre {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px; font-weight: 500; color: var(--deep);
  }
  .producto-subtotal { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .chevron {
    width: 18px; height: 18px; stroke: var(--mauve); fill: none; stroke-width: 2;
    transition: transform 0.25s; flex-shrink: 0;
  }
  .chevron.open { transform: rotate(180deg); }

  /* DETALLE */
  .producto-detalle {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
    border-top: 0px solid var(--border);
  }
  .producto-detalle.open {
    max-height: 600px;
    border-top: 1px solid var(--border);
  }
  .detalle-inner { padding: 0.875rem 1.25rem; }

  .detalle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.625rem 0; border-bottom: 1px solid var(--border);
  }
  .detalle-row:last-child { border-bottom: none; }

  .detalle-cliente { font-size: 14px; color: var(--text); }
  .detalle-right { display: flex; align-items: center; gap: 10px; }
  .detalle-qty {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 500; color: var(--deep);
  }
  .estado-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  /* PEDIDO CARD (vista de pedidos) */
  .pedido-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 1rem; overflow: hidden;
  }
  .pedido-header {
    padding: 1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .pedido-left { display: flex; align-items: center; gap: 12px; }
  .status-indicator { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-sin_confirmar { background: var(--yellow-dot); animation: livePulse 1.8s infinite; }
  .status-confirmado { background: var(--green-dot); }
  .status-cancelado { background: var(--red-dot); }
  .status-hecho { background: var(--muted); }

  .pedido-nombre {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 500; color: var(--deep);
  }
  .pedido-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pedido-right { text-align: right; }
  .pedido-total {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 500; color: var(--deep);
  }
  .estado-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 10px;
    font-size: 11px; margin-top: 4px;
  }
  .badge-sin_confirmar { background: var(--yellow-bg); color: #7A5A10; border: 1px solid var(--yellow-border); }
  .badge-confirmado { background: var(--green-bg); color: #1B5E20; border: 1px solid var(--green-border); }
  .badge-cancelado { background: var(--red-bg); color: #B71C1C; border: 1px solid var(--red-border); }
  .badge-hecho { background: var(--blush); color: var(--muted); border: 1px solid var(--border); }

  .pedido-detalle {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
    border-top: 0px solid var(--border);
  }
  .pedido-detalle.open { max-height: 500px; border-top: 1px solid var(--border); }
  .pedido-detalle-inner { padding: 1rem 1.25rem; }

  .detalle-item {
    display: flex; justify-content: space-between;
    font-size: 14px; color: var(--text); padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .detalle-item:last-of-type { border-bottom: none; }
  .detalle-item span:first-child { color: var(--muted); }
  .detalle-total {
    display: flex; justify-content: space-between;
    font-weight: 500; color: var(--deep);
    padding-top: 10px; margin-top: 4px;
    border-top: 1px solid var(--border);
    font-family: 'Cormorant Garamond', serif; font-size: 17px;
  }
  .detalle-contacto {
    margin-top: 10px; padding: 10px; background: var(--blush);
    border-radius: 10px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .detalle-contacto svg { width: 15px; height: 15px; stroke: var(--mauve); fill: none; stroke-width: 1.5; flex-shrink: 0; }

  .acciones { display: flex; gap: 8px; margin-top: 12px; }
  .accion-btn {
    flex: 1; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s; background: none; color: var(--muted);
  }
  .accion-btn.hecho { background: var(--deep); color: var(--white); border-color: var(--deep); }
  .accion-btn.hecho:hover { background: var(--mauve); }
  .accion-btn.cancelar:hover { background: var(--red-bg); color: var(--red-dot); border-color: var(--red-border); }
  .accion-btn.restaurar { color: var(--green-dot); border-color: var(--green-border); }
  .accion-btn.restaurar:hover { background: var(--green-bg); }
  .accion-btn.eliminar { color: var(--red-dot); border-color: var(--red-border); }
  .accion-btn.eliminar:hover { background: var(--red-bg); }

  /* EMPTY / LOADING */
  .empty-state {
    text-align: center; padding: 4rem 2rem; color: var(--muted);
  }
  .empty-state svg { width: 48px; height: 48px; stroke: var(--rose); fill: none; stroke-width: 1.2; margin-bottom: 1rem; }
  .empty-state p { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .empty-state small { font-size: 13px; }

  .loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 14px; }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);
    border-top-color: var(--mauve); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* NOTIF BANNER */
  .notif-banner {
    background: var(--blush); border-bottom: 1px solid var(--border);
    padding: 0.875rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .notif-banner p { font-size: 13px; color: var(--text); line-height: 1.4; }
  .notif-banner p strong { color: var(--deep); }
  .notif-allow {
    white-space: nowrap; padding: 8px 16px; border-radius: 20px;
    background: var(--deep); color: var(--white); border: none;
    font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .notif-dismiss { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--deep); color: var(--white);
    padding: 10px 24px; border-radius: 24px; font-size: 13px;
    z-index: 500; opacity: 0; transition: all 0.3s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <svg viewBox="0 0 14 14" fill="#E8C5BA"><path d="M7 0L8.2 5.8L14 7L8.2 8.2L7 14L5.8 8.2L0 7L5.8 5.8Z"/></svg>
    Gia's
  </div>
  <div class="live-dot"><span></span>En vivo</div>
</header>

<div id="notifBanner" class="notif-banner" style="display:none">
  <p><strong>Activa las notificaciones</strong> para saber cuando llega un pedido nuevo.</p>
  <button class="notif-allow" onclick="solicitarNotificaciones()">Activar</button>
  <button class="notif-dismiss" onclick="cerrarBanner()">&#x2715;</button>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-num" id="statPendientes">0</div>
    <div class="stat-label">Pendientes</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statConfirmados">0</div>
    <div class="stat-label">Confirmados</div>
  </div>
  <div class="stat-item">
    <div class="stat-num" id="statTotal">$0</div>
    <div class="stat-label">Hoy</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="cambiarTab('productos', this)">Por producto</button>
  <button class="tab-btn" onclick="cambiarTab('pedidos', this)">Por pedido</button>
</div>

<!-- TAB: PRODUCTOS -->
<div class="tab-content active" id="tab-productos">
  <div id="productosContainer">
    <div class="loading"><div class="spinner"></div>Cargando...</div>
  </div>
</div>

<!-- TAB: PEDIDOS -->
<div class="tab-content" id="tab-pedidos">
  <div id="pedidosContainer">
    <div class="loading"><div class="spinner"></div>Cargando...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsTW5ZyPkshQG6E_ZRisMeo3vxft4TuL8",
  authDomain: "gia-s-830e9.firebaseapp.com",
  projectId: "gia-s-830e9",
  storageBucket: "gia-s-830e9.firebasestorage.app",
  messagingSenderId: "695351178205",
  appId: "1:695351178205:web:6b269da32caaaf1f763c34"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosLosPedidos = [];
let primeraVez = true;

// Limitar a últimos 50 pedidos para no sobrecargar
const q = query(collection(db, 'pedidos'), orderBy('fecha', 'desc'), limit(50));

let renderTimeout = null;

onSnapshot(q, (snapshot) => {
  // Solo procesar cambios reales
  if (!primeraVez) {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') {
        const p = change.doc.data();
        enviarNotificacion(`Nuevo pedido de ${p.cliente}`, `Total: $${p.total?.toFixed(2)}`);
      }
      if (change.type === 'modified') {
        const p = change.doc.data();
        if (p.estado === 'confirmado') {
          enviarNotificacion(`Pedido confirmado`, `${p.cliente} confirmo su reserva`);
        }
      }
    });
  }

  const nuevos = [];
  snapshot.forEach(d => nuevos.push({ id: d.id, ...d.data() }));
  primeraVez = false;
  todosLosPedidos = nuevos;
  actualizarStats();

  // Debounce: evitar re-renders múltiples en rafaga
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(() => {
    renderProductos();
    renderPedidos();
  }, 300);
});

function actualizarStats() {
  const pendientes = todosLosPedidos.filter(p => p.estado === 'sin_confirmar').length;
  const confirmados = todosLosPedidos.filter(p => p.estado === 'confirmado').length;
  const hoy = new Date();
  const totalHoy = todosLosPedidos
    .filter(p => {
      if (!p.fecha) return false;
      const f = p.fecha.toDate ? p.fecha.toDate() : new Date(p.fecha);
      return f.toDateString() === hoy.toDateString() && p.estado !== 'cancelado';
    })
    .reduce((sum, p) => sum + (p.total || 0), 0);

  document.getElementById('statPendientes').textContent = pendientes;
  document.getElementById('statConfirmados').textContent = confirmados;
  document.getElementById('statTotal').textContent = '$' + totalHoy.toFixed(0);
}

function renderProductos() {
  const container = document.getElementById('productosContainer');

  // Solo pedidos confirmados
  const confirmados = todosLosPedidos.filter(p => p.estado === 'confirmado');

  if (confirmados.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 48 48"><path d="M12 4L6 12v28a4 4 0 004 4h28a4 4 0 004-4V12l-6-8z" stroke-linecap="round" stroke-linejoin="round"/><line x1="6" y1="12" x2="42" y2="12" stroke-linecap="round"/><path d="M32 20a8 8 0 01-16 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>No hay pedidos confirmados</p>
        <small>Solo se muestran los confirmados</small>
      </div>`;
    return;
  }

  // Agrupar por producto
  const porProducto = {};
  confirmados.forEach(pedido => {
    pedido.items?.forEach(item => {
      if (!porProducto[item.nombre]) {
        porProducto[item.nombre] = {
          nombre: item.nombre,
          totalCantidad: 0,
          totalValor: 0,
          pedidos: []
        };
      }
      porProducto[item.nombre].totalCantidad += item.cantidad;
      porProducto[item.nombre].totalValor += item.subtotal || 0;
      porProducto[item.nombre].pedidos.push({
        cliente: pedido.cliente,
        cantidad: item.cantidad,
        estado: pedido.estado,
        pedidoId: pedido.id
      });
    });
  });

  const productos = Object.values(porProducto).sort((a,b) => b.totalCantidad - a.totalCantidad);

  container.innerHTML = productos.map((p, i) => `
    <div class="producto-card">
      <div class="producto-header" onclick="toggleProducto('prod-${i}', this)">
        <div class="producto-left">
          <div class="producto-cantidad">
            <span class="cantidad-num">${p.totalCantidad}</span>
            <span class="cantidad-label">uds</span>
          </div>
          <div>
            <p class="producto-nombre">${p.nombre}</p>
            <p class="producto-subtotal">$${p.totalValor.toFixed(2)} en pedidos confirmados</p>
          </div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="producto-detalle" id="prod-${i}">
        <div class="detalle-inner">
          ${p.pedidos.map(d => `
            <div class="detalle-row">
              <span class="detalle-cliente">${d.cliente}</span>
              <div class="detalle-right">
                <span class="detalle-qty">x${d.cantidad}</span>
                <div class="estado-dot" style="background:${d.estado === 'confirmado' ? '#2E7D32' : '#D4A820'}"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function renderPedidos() {
  const container = document.getElementById('pedidosContainer');

  // Ordenar: confirmados primero, luego sin confirmar, luego el resto
  const orden = { confirmado: 0, sin_confirmar: 1, hecho: 2, cancelado: 3 };
  todosLosPedidos.sort((a, b) => (orden[a.estado] ?? 9) - (orden[b.estado] ?? 9));

  if (todosLosPedidos.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 48 48"><path d="M12 4L6 12v28a4 4 0 004 4h28a4 4 0 004-4V12l-6-8z" stroke-linecap="round" stroke-linejoin="round"/><line x1="6" y1="12" x2="42" y2="12" stroke-linecap="round"/><path d="M32 20a8 8 0 01-16 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>No hay pedidos aun</p>
        <small>Los pedidos aparecen en tiempo real</small>
      </div>`;
    return;
  }

  const estadoLabels = { sin_confirmar:'Sin confirmar', confirmado:'Confirmado', cancelado:'Cancelado', hecho:'Hecho' };

  container.innerHTML = todosLosPedidos.map(p => {
    const fecha = p.fecha?.toDate ? p.fecha.toDate() : new Date();
    const horaStr = fecha.toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    const itemsStr = p.items?.map(i => `${i.nombre} x${i.cantidad}`).join(', ') || '';
    const mostrarAcciones = p.estado === 'confirmado' || p.estado === 'sin_confirmar';

    return `
    <div class="pedido-card">
      <div class="pedido-header" onclick="togglePedido('ped-${p.id}', this)">
        <div class="pedido-left">
          <div class="status-indicator status-${p.estado}"></div>
          <div>
            <p class="pedido-nombre">${p.cliente}</p>
            <p class="pedido-meta">${horaStr} — ${itemsStr.substring(0,35)}${itemsStr.length>35?'...':''}</p>
          </div>
        </div>
        <div class="pedido-right">
          <p class="pedido-total">$${(p.total||0).toFixed(2)}</p>
          <div class="estado-badge badge-${p.estado}">${estadoLabels[p.estado]||p.estado}</div>
        </div>
      </div>
      <div class="pedido-detalle" id="ped-${p.id}">
        <div class="pedido-detalle-inner">
          ${p.items?.map(i=>`
            <div class="detalle-item">
              <span>${i.nombre} x${i.cantidad}</span>
              <span>$${i.subtotal?.toFixed(2)}</span>
            </div>`).join('')||''}
          <div class="detalle-total"><span>Total</span><span>$${(p.total||0).toFixed(2)}</span></div>
          <div class="detalle-contacto">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${p.contacto} (${p.tipoContacto})
          </div>
          <div class="acciones">
            ${p.estado==='confirmado' ? `<button class="accion-btn hecho" onclick="marcarHecho('${p.id}')">Marcar como hecho</button>` : ''}
            ${p.estado==='sin_confirmar' ? `<button class="accion-btn cancelar" onclick="cancelarPedido('${p.id}')">Cancelar pedido</button>` : ''}
            ${p.estado==='cancelado' ? `
              <button class="accion-btn restaurar" onclick="restaurarPedido('${p.id}')">Restaurar</button>
              <button class="accion-btn eliminar" onclick="eliminarPedido('${p.id}')">Eliminar</button>
            ` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleProducto(id, btn) {
  const detalle = document.getElementById(id);
  const chevron = btn.querySelector('.chevron');
  detalle.classList.toggle('open');
  chevron.classList.toggle('open');
}

function togglePedido(id) {
  document.getElementById(id).classList.toggle('open');
}

async function marcarHecho(id) {
  try {
    await updateDoc(doc(db, 'pedidos', id), { estado: 'hecho', hechoEn: serverTimestamp() });
    showToast('Pedido marcado como hecho');
  } catch(e) { showToast('Error al actualizar'); }
}

async function cancelarPedido(id) {
  try {
    await updateDoc(doc(db, 'pedidos', id), { estado: 'cancelado', canceladoEn: serverTimestamp() });
    showToast('Pedido cancelado');
  } catch(e) { showToast('Error al actualizar'); }
}

async function restaurarPedido(id) {
  try {
    await updateDoc(doc(db, 'pedidos', id), { estado: 'sin_confirmar', restauradoEn: serverTimestamp() });
    showToast('Pedido restaurado');
  } catch(e) { showToast('Error al restaurar'); }
}

async function eliminarPedido(id) {
  if (!confirm('Seguro que deseas eliminar este pedido? Esta accion no se puede deshacer.')) return;
  try {
    await deleteDoc(doc(db, 'pedidos', id));
    showToast('Pedido eliminado');
  } catch(e) { showToast('Error al eliminar'); }
}

function cambiarTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function enviarNotificacion(titulo, cuerpo) {
  if (Notification.permission === 'granted') {
    new Notification(titulo, { body: cuerpo, icon: '/icon-192.png' });
  }
}

function solicitarNotificaciones() {
  Notification.requestPermission().then(p => {
    if (p === 'granted') { showToast('Notificaciones activadas'); cerrarBanner(); }
  });
}

function cerrarBanner() {
  document.getElementById('notifBanner').style.display = 'none';
  localStorage.setItem('notifBannerDismissed', '1');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('load', () => {
  if (Notification.permission !== 'granted' && !localStorage.getItem('notifBannerDismissed')) {
    document.getElementById('notifBanner').style.display = 'flex';
  }
});

window.toggleProducto = toggleProducto;
window.togglePedido = togglePedido;
window.marcarHecho = marcarHecho;
window.cancelarPedido = cancelarPedido;
window.restaurarPedido = restaurarPedido;
window.eliminarPedido = eliminarPedido;
window.cambiarTab = cambiarTab;
window.solicitarNotificaciones = solicitarNotificaciones;
window.cerrarBanner = cerrarBanner;
</script>
</body>
</html>
